name: Windows slim suite
on:
  push:
    branches: [codex/windows-slim-20261117]
    paths: [contrib/suite-builder/**, .github/workflows/suite-windows-slim.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-slim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contrib/suite-builder
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: contrib/suite-builder
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node automation/ci-bootstrap.mjs win32-x64
      - run: node automation/build.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-slim-${{ github.run_number }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          path: |
            contrib/suite-builder/dist/automated/**/*.exe
            contrib/suite-builder/dist/automated/**/report.json
            contrib/suite-builder/dist/automated/**/SHA256SUMS.txt
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: contrib/suite-builder
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-slim-${{ github.run_number }}
          path: release-input
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node contrib/suite-builder/automation/publish-windows-slim.mjs release-input
