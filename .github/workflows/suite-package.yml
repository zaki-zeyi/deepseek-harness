name: Community suite packages

on:
  push:
    paths:
      - contrib/suite-builder/**
      - .github/workflows/suite-package.yml
  workflow_dispatch:
    inputs:
      publish_installers:
        description: Upload installable packages after all checks pass
        type: boolean
        default: false
      macos_runner:
        description: Mac runner image; use macos-26 if macos-15 capacity is unavailable
        type: choice
        options:
          - macos-15
          - macos-26
        default: macos-15

permissions:
  contents: read

concurrency:
  group: suite-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'darwin-arm64' && inputs.macos_runner == 'macos-26' && 'macos-26' || matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
            shell: pwsh
          - target: darwin-arm64
            runner: macos-15
            shell: bash
    defaults:
      run:
        working-directory: contrib/suite-builder
        shell: ${{ matrix.shell }}
    env:
      DSH_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: contrib/suite-builder
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Select test or installer publication
        id: mode
        env:
          REQUEST_PUBLISH_INSTALLERS: ${{ inputs.publish_installers }}
        run: >-
          node --input-type=module -e "import fs from 'node:fs';
          const settings=JSON.parse(fs.readFileSync('automation/ci-settings.json'));
          const publish=process.env.GITHUB_EVENT_NAME==='workflow_dispatch'?process.env.REQUEST_PUBLISH_INSTALLERS==='true':settings.publishInstallers===true;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'publish='+publish+'\n');
          console.log(publish?'Installer uploads enabled':'Test build only; installer uploads disabled');"
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        if: runner.os == 'macOS'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install only suite tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools ci --ignore-scripts --no-audit --no-fund
      - name: Check list and download guards
        run: npm test
      - name: Prepare pinned official core and native plugin profile
        run: node automation/ci-bootstrap.mjs ${{ matrix.target }}
      - name: Build Windows installer and verify runtime
        if: runner.os == 'Windows'
        run: node automation/build.mjs
      - name: Build native Mac package
        if: runner.os == 'macOS'
        run: |
          python3 -u automation/build_macos.py ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          python3 -u automation/verify_macos.py ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          node automation/ci-mac-smoke.mjs ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Upload Windows installer
        if: runner.os == 'Windows' && steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: suite-${{ matrix.target }}-${{ github.run_number }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          path: |
            contrib/suite-builder/dist/automated/**/*.exe
            contrib/suite-builder/dist/automated/**/report.json
            contrib/suite-builder/dist/automated/**/SHA256SUMS.txt
      - name: Upload Mac installer
        if: runner.os == 'macOS' && steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: suite-${{ matrix.target }}-${{ github.run_number }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          path: |
            contrib/suite-builder/dist/automated/macos-*/*.zip
            contrib/suite-builder/dist/automated/macos-*/report-*.json
            contrib/suite-builder/dist/automated/macos-*/SHA256SUMS.txt
      - name: Upload test reports
        if: steps.mode.outputs.publish != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: suite-test-report-${{ matrix.target }}-${{ github.run_number }}
          retention-days: 3
          if-no-files-found: error
          path: |
            contrib/suite-builder/dist/automated/**/report*.json
            contrib/suite-builder/dist/automated/**/SHA256SUMS.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: suite-failure-${{ matrix.target }}-${{ github.run_number }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            contrib/suite-builder/build/**/report.json
            contrib/suite-builder/build/**/build.log
